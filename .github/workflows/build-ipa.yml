name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive ContainerStudio (Release, Unsigned)
        run: |
          xcodebuild \
            -project ContainerStudio.xcodeproj \
            -scheme ContainerStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ContainerStudio.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify App Groups entitlement
        run: |
          APP_PATH="build/ContainerStudio.xcarchive/Products/Applications/ContainerStudio.app"
          XCENT_PATH="$APP_PATH/archived-expanded-entitlements.xcent"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: ContainerStudio.app not found!"
            exit 1
          fi
          if [ -f "$XCENT_PATH" ]; then
            echo "Found archived-expanded-entitlements.xcent:"
            cat "$XCENT_PATH"
            grep -q "com.apple.security.application-groups" "$XCENT_PATH"
          else
            echo "Checking source entitlements:"
            grep -q "com.apple.security.application-groups" "ContainerStudio/Resources/ContainerStudio.entitlements"
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/ContainerStudio.xcarchive/Products/Applications/ContainerStudio.app" "build/Payload/ContainerStudio.app"
          cd build
          zip -qry ContainerStudio.ipa Payload

      - name: Upload ContainerStudio.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContainerStudio-ipa
          path: build/ContainerStudio.ipa
          if-no-files-found: error
